<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Finora — controle financeiro pessoal com Open Finance e consultor inteligente">
<title>Finora</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="auth" class="auth hidden">
  <canvas id="authCanvas" aria-hidden="true"></canvas>
  <div class="auth-card" id="googleCard">
    <svg class="auth-mark" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="authMarkGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4f46e5"/>
          <stop offset="1" stop-color="#0e7490"/>
        </linearGradient>
      </defs>
      <circle class="auth-mark-ring" cx="60" cy="60" r="46" fill="none" stroke="url(#authMarkGrad)" stroke-width="1.5" opacity=".35"/>
      <circle class="auth-mark-shape" cx="42" cy="52" r="26" fill="url(#authMarkGrad)" opacity=".22"/>
      <circle class="auth-mark-shape" cx="76" cy="70" r="19" fill="url(#authMarkGrad)" opacity=".3"/>
      <circle class="auth-mark-shape" cx="66" cy="42" r="13" fill="url(#authMarkGrad)" opacity=".9"/>
    </svg>
    <div class="brand big"><span class="logo">F</span> Finora</div>
    <p class="muted">Sua vida financeira organizada, com alertas e orientação inteligente.</p>
    <p class="small muted" style="margin-top:18px">Entre com sua conta Google. Em seguida, o código do seu app autenticador confirma que é você mesmo.</p>
    <div id="googleBtn" style="margin-top:16px;display:flex;justify-content:center"></div>
    <p class="error" id="authError"></p>
  </div>
  <div class="auth-card hidden" id="mfaCard"></div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo">F</span> Finora</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="userName" class="muted small"></div>
      <button class="btn ghost small" id="logout">Sair</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="pageTitle">Painel</h1>
      <div class="top-actions">
        <input type="month" id="monthRef" title="Mês de referência">
        <button class="icon-btn" id="themeBtn" title="Aparência"></button>
        <button class="icon-btn" id="alertsBtn" title="Alertas"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span id="alertBadge" class="badge hidden"></span></button>
        <button class="btn primary" id="quickAdd">+ Lançamento</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <button id="assistantBtn" title="Assistente Finora"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><span id="apBadge" class="badge hidden"></span></button>
  <div id="assistantPanel" class="hidden">
    <div class="ap-head"><strong><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg> Assistente Finora</strong><button class="ap-close" id="apClose" type="button" aria-label="Fechar"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div id="ap-msgs"></div>
    <div class="ap-chips" id="apChips"></div>
    <form id="apForm"><input id="apInput" placeholder="Pergunte ou peça algo…" autocomplete="off"><button class="btn primary small" type="submit" aria-label="Enviar"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button></form>
  </div>
</div>

<dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
<div id="toast" class="toast hidden"></div>
<div id="onboarding" class="onboarding hidden"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
